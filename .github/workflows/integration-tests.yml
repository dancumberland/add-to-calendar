name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deployment
        # VERCEL_TOKEN required for SHA-bound testing (prevents false passes on stale deployments).
        # Get a token at vercel.com/account/tokens → add as VERCEL_TOKEN repo secret:
        #   gh secret set VERCEL_TOKEN --repo dancumberland/add-to-calendar --body "your-token"
        # Without it this step fails loudly (fail-closed) rather than silently testing old code.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN not set. CI cannot verify this commit is deployed."
            echo "::error::Add it at: github.com/dancumberland/add-to-calendar/settings/secrets/actions"
            echo "::error::Get a token at: vercel.com/account/tokens"
            exit 1
          fi

          echo "Waiting for Vercel deployment of commit: $GITHUB_SHA"
          DEPLOY_URL=""

          # SHA-bound: poll until deployment for THIS commit's SHA is READY
          for i in $(seq 1 18); do
            sleep 10
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?app=kit-app-build&limit=10" 2>/dev/null || echo '{}')
            RESULT=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sha = '$GITHUB_SHA'
          for d in data.get('deployments', []):
            meta = d.get('meta', {})
            if meta.get('githubCommitSha', '').startswith(sha[:12]):
              state = d.get('state', '')
              if state == 'READY':
                print('ready:https://' + d['url'])
              elif state == 'ERROR':
                print('error')
              else:
                print('building')
              break
          " 2>/dev/null || echo "")
            if [[ "$RESULT" == ready:* ]]; then
              DEPLOY_URL="${RESULT#ready:}"
              echo "SHA-bound deployment ready: $DEPLOY_URL"
              break
            elif [ "$RESULT" = "error" ]; then
              echo "Vercel deployment failed."
              exit 1
            fi
            echo "Attempt $i/18: $RESULT..."
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Timed out waiting for deployment of $GITHUB_SHA"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          echo "Running Kit Calendar integration tests against: $DEPLOY_URL"
          RESPONSE=$(curl -sf \
            -H "x-test-secret: ${{ secrets.WEEKLY_REPORT_SECRET }}" \
            "$DEPLOY_URL/api/test-calendars")

          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          passed = data.get('passed', 0)
          failed = data.get('failed', 0)
          total = data.get('total', 0)
          http_passed = data.get('httpPassed', 0)
          http_failed = data.get('httpFailed', 0)
          print(f'Unit tests:  {passed}/{total} passed')
          print(f'HTTP tests:  {http_passed}/{http_passed + http_failed} passed')
          if failed > 0 or http_failed > 0:
              print('FAILURES DETECTED:')
              for r in data.get('results', []):
                  if r.get('status') != 'PASS':
                      print(f'  FAIL: {r[\"name\"]}')
                      if r.get('error'):
                          print(f'        {r[\"error\"]}')
              sys.exit(1)
          print('All tests passed.')
          "
